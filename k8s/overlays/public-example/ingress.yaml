apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: app, namespace: temp-log-original}
spec:
  ingressClassName: REPLACE_WITH_YOUR_CONTROLLER
  tls: [{hosts: [blog.example.com], secretName: blog-tls}]
  rules:
    - host: blog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: app, port: {number: 4000}}}
