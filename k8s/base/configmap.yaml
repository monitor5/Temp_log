apiVersion: v1
kind: ConfigMap
metadata:
  name: ghost-config
data:
  NODE_ENV: production
  # Bootstrap through localhost port-forward, then change to the real HTTPS URL.
  url: http://localhost:2368
  server__host: 0.0.0.0
  server__port: "2368"
  database__client: mysql
  database__connection__host: mysql
  database__connection__port: "3306"
  database__connection__user: ghost
  database__connection__database: ghost
  database__pool__min: "0"
  database__pool__max: "10"
  paths__contentPath: /var/lib/ghost/content
  logging__transports: '["stdout"]'
  mail__transport: SMTP
  mail__options__port: "587"
  mail__options__secure: "false"
  mail__options__requireTLS: "true"
  privacy__useGravatar: "false"
  privacy__useIndexNow: "false"
  privacy__useRpcPing: "false"
  privacy__useUpdateCheck: "false"
