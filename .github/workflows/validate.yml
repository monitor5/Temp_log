name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_PORT: '8081'
      PUBLIC_URL: http://localhost:8081
      COMPOSE_PROJECT_NAME: temp-log-test-ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0'}
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: make up
      - run: python3 tests/smoke.py create --project temp-log-test-ci
      - name: Verify persistence after container recreation
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 240
          python3 tests/smoke.py verify --project temp-log-test-ci
      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s/base > artifacts/k8s-base.yaml
          kubectl kustomize k8s/overlays/public-example > artifacts/k8s-public.yaml
      - name: Install verified Trivy
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tar.gz' | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
      - run: ./scripts/scan-images.sh
      - if: failure()
        run: docker compose logs --tail=60
      - if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-reports
          path: |
            artifacts/*-trivy.json
            artifacts/*-sbom.json
            artifacts/k8s-*.yaml
          retention-days: 7
