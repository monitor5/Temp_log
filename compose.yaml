# Local preview only. Internet production uses k8s + HTTPS + real SMTP.
name: temp-log
services:
  ghost:
    image: temp-log:local
    build: .
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GHOST_PORT:-2368}:2368"
    environment:
      NODE_ENV: production
      url: ${GHOST_URL:-http://localhost:2368}
      server__host: 0.0.0.0
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: ${MYSQL_PASSWORD:?Run python3 scripts/init-local.py first}
      database__connection__database: ghost
      logging__transports: '["stdout"]'
      privacy__useUpdateCheck: "false"
      privacy__useGravatar: "false"
      privacy__useRpcPing: "false"
      mail__transport: SMTP
      mail__from: 'Temp_log <noreply@localhost.test>'
      mail__options__host: mailpit
      mail__options__port: "1025"
      mail__options__secure: "false"
    volumes:
      - ghost-content:/var/lib/ghost/content
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=128m
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "require('http').get({host:'127.0.0.1',port:2368,path:'/',headers:{'X-Forwarded-Proto':'https'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 40s
  db:
    image: temp-log-db:local
    build:
      context: .
      dockerfile: Dockerfile.mysql
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    command: [--mysqlx=0, --secure-file-priv=NULL, --innodb-buffer-pool-size=128M]
    environment:
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python3 scripts/init-local.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python3 scripts/init-local.py first}
      MYSQL_ROOT_HOST: localhost
    volumes:
      - mysql-data:/var/lib/mysql
    tmpfs:
      - /tmp:uid=999,gid=999,mode=1777,size=128m
      - /var/run/mysqld:uid=999,gid=999,mode=0755,size=16m
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --user=ghost --host=127.0.0.1 --database=ghost --execute="SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 15
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 60s
  mailpit:
    # Development inbox: mail never goes to an external recipient.
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MP_DATABASE: /tmp/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=64m
    mem_limit: 128m
    cpus: 0.25
volumes:
  ghost-content:
  mysql-data:
